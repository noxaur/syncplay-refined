name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: python3 scripts/release.py self-test
      - run: python3 scripts/check_disband.py
      - run: dotnet build Jellyfin.Plugin.SyncPlayRefined/Jellyfin.Plugin.SyncPlayRefined.csproj -c Release

  catalog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: catalog
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync to tip of main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Pack catalog entry
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release.py release --changelog "$(git log -1 --pretty=%s)"
      - name: Push catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.zip manifest.json build.yaml Jellyfin.Plugin.SyncPlayRefined/Jellyfin.Plugin.SyncPlayRefined.csproj
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Release catalog"
          git pull --rebase origin main
          git push
